[project]
name = "store-ai-backend"
version = "0.1.0"
description = "AI order extraction and store management backend"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=3.55.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["db: needs DATABASE_URL (real Supabase Postgres)"]
